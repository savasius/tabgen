[project]
name = "tabgen-api"
version = "0.1.0"
description = "TabGen HTTP API (FastAPI) with an in-process analysis job queue"
requires-python = ">=3.10"
dependencies = [
  "tabgen-analysis",
  "fastapi>=0.110",
  "uvicorn[standard]",
  "python-multipart",
  "yt-dlp",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tabgen_api*"]
